<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Seguiment de la feina</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <script type="importmap">
    { "imports": { "three": "/static/vendor/three/three.module.min.js",
                   "three/addons/controls/OrbitControls.js": "/static/vendor/three/OrbitControls.js" } }
  </script>
  <style>
    main { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
    .capcalera { padding: 8px 0 14px; }
    .capcalera .empresa { color: var(--blau); font-weight: 700; }
    .p-acc { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .enviar-msg { position: static; }
    .fila-enviar span { margin-right: auto; }
    #toasts { bottom: 24px; }
    .aturada { background: var(--verm-clar); border: 2px solid var(--verm); border-radius: var(--radi); padding: 14px 16px; margin-bottom: 14px; }
    .aturada h2 { margin: 0 0 6px; color: var(--verm); }
    .aturada ul { margin: 6px 0 0; padding-left: 18px; }
    .pagament-op { border: 1px solid var(--vora); border-radius: 12px; padding: 12px; margin: 8px 0; }
    .copia { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
    .copia code { flex: 1; background: var(--fons); padding: 8px 10px; border-radius: 8px; font-size: .95rem; word-break: break-all; }
    .estrelles-in { display: flex; gap: 6px; font-size: 2rem; }
    .estrelles-in button { background: none; border: 0; cursor: pointer; color: #c9ced8; font-size: 2rem; padding: 0; }
    .estrelles-in button.on { color: #f5a623; }
  </style>
</head>
<body>
  <main id="p"><div class="carregant">Carregant…</div></main>
  <div id="toasts"></div>
  <script type="module">
    import { vistaPortal } from "/static/js/portal.js";
    vistaPortal(document.getElementById("p"), location.pathname.split("/")[2]);
  </script>
</body>
</html>
